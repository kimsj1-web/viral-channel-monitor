<title>협찬 패키징 (ZIP 자동 생성)</title>
<style>
:root{
  --bg:#f6f6f4; --card:#ffffff; --text:#1a1a1a; --muted:#6b7280;
  --border:#e5e7eb; --line:#ececeb; --accent:#4f46e5; --accent-bg:#eef2ff;
  --img:#2563eb; --img-bg:#eff6ff; --txt:#d97706; --txt-bg:#fff7ed;
  --danger:#dc2626; --ok:#16a34a; --radius:10px; --slot:#fafafa;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#161619; --card:#1f2024; --text:#ededed; --muted:#9aa0aa;
  --border:#2e3036; --line:#26282e; --accent:#a5b4fc; --accent-bg:#232542;
  --img:#60a5fa; --img-bg:#17233b; --txt:#fbbf24; --txt-bg:#2a2112;
  --danger:#f87171; --ok:#4ade80; --slot:#191a1e;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",Segoe UI,Roboto,sans-serif;
  padding:env(safe-area-inset-top,0) 14px env(safe-area-inset-bottom,0);font-size:14px;line-height:1.5}
.wrap{max-width:1400px;margin:0 auto;padding:18px 4px 80px}
#mats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
@media(max-width:860px){#mats{grid-template-columns:1fr}}
h1{font-size:18px;font-weight:600;margin:0}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:4px}
.badge{font-size:11px;font-weight:600;color:var(--accent);background:var(--accent-bg);padding:3px 9px;border-radius:999px}
.status{font-size:12px;color:var(--muted);margin:0 0 16px}
.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-left:auto}
input[type=date],input[type=text],textarea,select{font:inherit;color:var(--text);background:var(--card);
  border:1px solid var(--border);border-radius:8px;padding:6px 9px}
textarea{width:100%;resize:vertical;line-height:1.5}
button{font:inherit;cursor:pointer;border:1px solid var(--border);background:var(--card);color:var(--text);
  border-radius:8px;padding:6px 11px}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.ghost{border:none;background:transparent;color:var(--muted);padding:2px 7px}
button.sm{padding:3px 8px;font-size:12px}
.mat{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:0}
.mat>h2{font-size:15px;font-weight:700;margin:0 0 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lbl{display:inline-block;font-size:12px;font-weight:700;color:var(--muted);margin:14px 0 6px}
.chip{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;font-weight:600}
.chip.img{color:var(--img);background:var(--img-bg)}
.chip.txt{color:var(--txt);background:var(--txt-bg)}
.chip.non{color:var(--muted);background:var(--line)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:720px){.grid2{grid-template-columns:1fr}}
.drop{border:1.5px dashed var(--border);border-radius:8px;padding:12px;text-align:center;color:var(--muted);
  background:var(--slot);cursor:pointer;font-size:13px}
.drop.hot{border-color:var(--accent);color:var(--accent);background:var(--accent-bg)}
.filelist{margin:6px 0 0;font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px}
.filelist .f{background:var(--line);border-radius:6px;padding:2px 7px;display:inline-flex;align-items:center;gap:6px}
.covers{display:flex;flex-direction:column;gap:10px}
.cover{border:1px solid var(--border);border-radius:8px;padding:10px;background:var(--slot)}
.cover .ch{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.cover textarea{min-height:46px}
.cover .thumb{width:40px;height:40px;border-radius:6px;object-fit:cover;border:1px solid var(--border);background:var(--card)}
.assignrow{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.assignrow:last-child{border-bottom:none}
.assignrow .nm{font-weight:600;min-width:150px}
.assignrow select{flex:1;min-width:160px}
.hintbad{color:var(--danger);font-size:12px}
.foot{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--border);
  padding:10px 16px calc(10px + env(safe-area-inset-bottom,0));display:flex;align-items:center;gap:12px;z-index:20}
.foot .grow{flex:1}
.prog{height:6px;background:var(--line);border-radius:999px;overflow:hidden;flex:1;max-width:280px;display:none}
.prog.show{display:block}
.prog>i{display:block;height:100%;width:0;background:var(--accent);transition:width .15s}
.toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%) translateY(20px);background:#111827;color:#fff;
  padding:9px 16px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:40}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.errbox{background:var(--txt-bg);border:1px solid var(--txt);color:var(--txt);border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:12px;display:none}
.errbox.show{display:block}
.errbox ul{margin:6px 0 0;padding-left:18px}
a.back{color:var(--accent);text-decoration:none;font-size:13px}
.muted{color:var(--muted)}
</style>

async function dbGet(k){var r=await SB.from('store').select('v').eq('k',k).maybeSingle();if(r.error)throw r.error;return r.data?r.data.v:null;}
function acctById(id){for(var i=0;i<ACCOUNTS.length;i++){if(ACCOUNTS[i].id===id)return ACCOUNTS[i];}return null;}
function stKey(){return 'pkg:'+DATE;}
function loadState(){try{STATE=JSON.parse(localStorage.getItem(stKey())||'null')||{materials:{}};}catch(e){STATE={materials:{}};}if(!STATE.materials)STATE.materials={};}

/* 소재별 상태 보장 (없으면 표지 2이미지+2텍스트로 기본 생성) */
function matState(mid){
  var s=STATE.materials[mid];
  if(!s){
    s={caption:'와 대박이다 ㄷㄷ',hashtag:'#유머 #이슈 #유행 #나폴리맛피아',covers:[],assign:{},manual:{}};
    s.covers.push({id:uid(),type:'image',copy:''});
    s.covers.push({id:uid(),type:'image',copy:''});
    s.covers.push({id:uid(),type:'text',copy:''});
    s.covers.push({id:uid(),type:'text',copy:''});
    STATE.materials[mid]=s;
  }
  if(!s.assign)s.assign={};
  if(!s.covers)s.covers=[];
  if(!s.manual)s.manual={};
  return s;
}
function coverById(s,cid){for(var i=0;i<s.covers.length;i++){if(s.covers[i].id===cid)return s.covers[i];}return null;}

/* 배정된 소재만 (슬롯에 계정이 1개 이상) */
var TYPE_RANK={image:0,text:1};
function typeRank(t){return TYPE_RANK[t]!=null?TYPE_RANK[t]:2;}
function shownMaterials(){
  if(!PLAN)return [];
  return PLAN.materials.map(function(m,i){
    var accs=(m.slots||[]).map(acctById).filter(Boolean);
    accs=accs.map(function(a,j){return {a:a,j:j};})
      .sort(function(x,y){return typeRank(x.a.type)-typeRank(y.a.type)||x.j-y.j;})
      .map(function(x){return x.a;});   // 이미지끼리/텍스트끼리 모이게(추가 순서는 타입 안에서 유지)
    return {id:m.id,index:i,accs:accs};
  }).filter(function(m){return m.accs.length>0;});
}
function letter(i){return String.fromCharCode(65+i);}
/* 표지도 타입별로 묶어서(이미지 먼저, 텍스트 뒤) — 저장 순서는 안 바꾸고 보기만 정렬 */
function coversOf(s){
  return s.covers.map(function(c,i){return {c:c,i:i};})
    .sort(function(a,b){return typeRank(a.c.type)-typeRank(b.c.type)||a.i-b.i;})
    .map(function(x){return x.c;});
}

/* 계정 기본 표지 선택: 계정 유형과 같은 타입의 첫 표지 */
function defaultCover(s,acc){
  var cov=coversOf(s);
  var want=acc.type==='image'?'image':acc.type==='text'?'text':null;
  if(want){for(var i=0;i<cov.length;i++){if(cov[i].type===want)return cov[i].id;}}
  return cov.length?cov[0].id:'';
}
function resolveCoverId(s,acc){
  var cur=s.assign[acc.name];
  if(cur&&coverById(s,cur))return cur;
  return defaultCover(s,acc);
}
/* 자동배정: 같은 타입끼리 "순서대로" 매칭.
   i번째 이미지 계정 → i번째 이미지 표지, i번째 텍스트 계정 → i번째 텍스트 표지.
   사용자가 드롭다운으로 직접 고른 계정(manual)은 그대로 유지. */
function ensureAssign(m){
  var s=matState(m.id),changed=false,cov=coversOf(s);
  var imgC=cov.filter(function(c){return c.type==='image';});
  var txtC=cov.filter(function(c){return c.type==='text';});
  var iN=0,tN=0;
  m.accs.forEach(function(a){
    var pool,idx;
    if(a.type==='text'){pool=txtC;idx=tN++;}
    else if(a.type==='image'){pool=imgC;idx=iN++;}
    else {pool=cov;idx=0;}
    if(s.manual[a.name]&&s.assign[a.name]&&coverById(s,s.assign[a.name]))return; // 직접 고른 건 유지
    var pick=pool.length?pool[Math.min(idx,pool.length-1)].id:(cov.length?cov[0].id:'');
    if(pick&&s.assign[a.name]!==pick){s.assign[a.name]=pick;changed=true;}
  });
  return changed;
}
/* 소재의 계정→표지 소유 맵 (중복 감지/드롭다운 비활성화용) */
function ownerMap(m){
  var s=matState(m.id),owner={};
  m.accs.forEach(function(a){var cid=resolveCoverId(s,a);if(cid&&!owner[cid])owner[cid]=a.name;});
  return owner;
}

function render(){
  var mats=shownMaterials();
  if(!mats.length){$('mats').innerHTML='<p class="muted">이 날짜에 배정된 계정이 없어요. 배정 화면에서 먼저 소재에 계정을 넣어주세요.</p>';footInfo();return;}
  var syncChanged=false;mats.forEach(function(m){if(ensureAssign(m))syncChanged=true;});if(syncChanged)saveState();
  var html=mats.map(function(m){
    var s=matState(m.id);
    var bodyFiles=FILES.body[m.id]||[];
    var bf=bodyFiles.length?bodyFiles.map(function(f,i){return '<span class="f">'+esc(f.name)+' <button class="ghost" data-act="delbody" data-mid="'+m.id+'" data-i="'+i+'">✕</button></span>';}).join(''):'<span class="muted">업로드된 본문 파일 없음</span>';
    var otherOpts=mats.filter(function(x){return x.id!==m.id&&(FILES.body[x.id]||[]).length;})
      .map(function(x){return '<option value="'+x.id+'">'+letter(x.index)+' 소재 본문 복사</option>';}).join('');
    var copyBodySel=otherOpts?'<select data-act="copybody" data-mid="'+m.id+'"><option value="">다른 소재 본문 복사…</option>'+otherOpts+'</select>':'';

    var covers=coversOf(s).map(function(c){
      var isImg=c.type==='image';
      var file=FILES.cover[c.id];
      var thumb=file?'<img class="thumb" src="'+URL.createObjectURL(file)+'">':'';
      var up=isImg?('<div class="drop" data-act="coverdrop" data-cid="'+c.id+'">'+(file?('✓ '+esc(file.name)):'표지 이미지 끌어다 놓기 / 클릭')+'</div>'):'';
      return '<div class="cover">'+
        '<div class="ch">'+thumb+
          '<select data-act="covertype" data-cid="'+c.id+'">'+
            '<option value="image"'+(isImg?' selected':'')+'>이미지 표지(이미지+카피)</option>'+
            '<option value="text"'+(!isImg?' selected':'')+'>텍스트 표지(카피만)</option>'+
          '</select>'+
          '<button class="ghost sm" data-act="delcover" data-cid="'+c.id+'" title="표지 삭제">✕</button>'+
        '</div>'+
        '<textarea data-act="copycopy" data-cid="'+c.id+'" placeholder="표지 카피">'+esc(c.copy)+'</textarea>'+
        up+'</div>';
    }).join('');

    var owner=ownerMap(m);
    var rows=m.accs.map(function(a){
      var rid=resolveCoverId(s,a);
      var chip=a.type==='image'?'<span class="chip img">이미지</span>':a.type==='text'?'<span class="chip txt">텍스트</span>':'<span class="chip non">미설정</span>';
      var opts=coversOf(s).map(function(c,ci){
        var label=(c.type==='image'?'🖼 ':'📝 ')+(c.copy?c.copy.slice(0,24):'(카피 없음) '+(ci+1));
        if(owner[c.id]&&owner[c.id]!==a.name)label+=' (사용중)';   // 안내만 — 선택은 가능
        return '<option value="'+c.id+'"'+(c.id===rid?' selected':'')+'>'+esc(label)+'</option>';
      }).join('');
      return '<div class="assignrow"><span class="nm">@'+esc(a.name)+'</span>'+chip+
        '<select data-act="assign" data-mid="'+m.id+'" data-name="'+esc(a.name)+'">'+opts+'</select></div>';
    }).join('');

    return '<div class="mat">'+
      '<h2>'+letter(m.index)+' 소재 <span class="muted" style="font-weight:400">· 배정 '+m.accs.length+'개 계정</span>'+
        '<label style="margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;user-select:none">'+
          '<input type="checkbox" data-act="selmat" data-mid="'+m.id+'"'+(SEL[m.id]?' checked':'')+' style="width:16px;height:16px"> ZIP에 포함</label></h2>'+

      '<div class="lbl">본문 파일 (이 소재의 모든 계정에 공통 복사됨)</div>'+
      '<div class="drop" data-act="bodydrop" data-mid="'+m.id+'">여기에 본문 파일 끌어다 놓기 / 클릭해서 선택 (예: 2.mp4, 3.png … 88.png)</div>'+
      '<div class="filelist">'+bf+'</div>'+
      (copyBodySel?'<div style="margin-top:6px">'+copyBodySel+'</div>':'')+

      '<div class="grid2">'+
        '<div><div class="lbl">캡션</div><textarea data-act="caption" data-mid="'+m.id+'" style="min-height:52px">'+esc(s.caption)+'</textarea></div>'+
        '<div><div class="lbl">해시태그</div><textarea data-act="hashtag" data-mid="'+m.id+'" style="min-height:52px">'+esc(s.hashtag)+'</textarea></div>'+
      '</div>'+
      '<div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap">'+
        '<button class="sm" data-act="applyall" data-mid="'+m.id+'">이 캡션·해시태그를 전체 소재에 적용</button>'+
      '</div>'+

      '<div class="lbl">표지 풀 (여기서 만든 표지를 아래에서 계정에 배정)</div>'+
      '<div class="covers">'+covers+'</div>'+
      '<div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap">'+
        '<button class="sm" data-act="addcover" data-mid="'+m.id+'" data-type="image">+ 이미지 표지</button>'+
        '<button class="sm" data-act="addcover" data-mid="'+m.id+'" data-type="text">+ 텍스트 표지</button>'+
      '</div>'+

      '<div class="lbl">계정별 표지 배정</div>'+rows+
    '</div>';
  }).join('');
  $('mats').innerHTML=html;
  footInfo();
}

function footInfo(){
  var mats=shownMaterials();var folders=0;mats.forEach(function(m){folders+=m.accs.length;});
  var selIds=mats.filter(function(m){return SEL[m.id];});
  $('footInfo').textContent='['+mmdd(DATE)+'] · 소재 '+mats.length+'개 · 폴더(계정) '+folders+'개 · 선택 '+selIds.length+'개';
}

/* ===== 이벤트 ===== */
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]');if(!t)return;var act=t.getAttribute('data-act');
  if(act==='bodydrop'){pickFiles(true,function(fs){addBody(t.getAttribute('data-mid'),fs);});}
  else if(act==='coverdrop'){pickFiles(false,function(fs){if(fs[0]){FILES.cover[t.getAttribute('data-cid')]=fs[0];render();}});}
  else if(act==='delbody'){var mid=t.getAttribute('data-mid');FILES.body[mid].splice(+t.getAttribute('data-i'),1);render();}
  else if(act==='addcover'){var s=matState(t.getAttribute('data-mid'));s.covers.push({id:uid(),type:t.getAttribute('data-type'),copy:''});saveState();render();}
  else if(act==='delcover'){var cid=t.getAttribute('data-cid');removeCover(cid);}
  else if(act==='applyall'){applyAll(t.getAttribute('data-mid'));}

});
document.addEventListener('input',function(e){
  var t=e.target.closest('[data-act]');if(!t)return;var act=t.getAttribute('data-act');
  if(act==='caption'){matState(t.getAttribute('data-mid')).caption=t.value;saveState();footInfo();}
  else if(act==='hashtag'){matState(t.getAttribute('data-mid')).hashtag=t.value;saveState();}
  else if(act==='copycopy'){var cid=t.getAttribute('data-cid'),caret=t.selectionStart;setCover(cid,'copy',t.value);saveState();render();var el=document.querySelector('textarea[data-act="copycopy"][data-cid="'+cid+'"]');if(el){el.focus();try{el.setSelectionRange(caret,caret);}catch(e){}}}
});
document.addEventListener('change',function(e){
  var t=e.target.closest('[data-act]');if(!t)return;var act=t.getAttribute('data-act');
  if(act==='assign'){var s=matState(t.getAttribute('data-mid'));var nm=t.getAttribute('data-name');s.assign[nm]=t.value;s.manual[nm]=true;saveState();render();}
  else if(act==='covertype'){setCover(t.getAttribute('data-cid'),'type',t.value);saveState();render();}
  else if(act==='selmat'){SEL[t.getAttribute('data-mid')]=t.checked;footInfo();}
  else if(act==='copybody'){var src=t.value;if(src){FILES.body[t.getAttribute('data-mid')]=(FILES.body[src]||[]).slice();render();}}
});

function setCover(cid,field,val){var mats=shownMaterials();for(var i=0;i<mats.length;i++){var s=matState(mats[i].id);var c=coverById(s,cid);if(c){c[field]=val;return;}}}
function removeCover(cid){var mats=shownMaterials();for(var i=0;i<mats.length;i++){var s=matState(mats[i].id);var idx=s.covers.findIndex(function(c){return c.id===cid;});if(idx>=0){s.covers.splice(idx,1);delete FILES.cover[cid];for(var k in s.assign){if(s.assign[k]===cid)delete s.assign[k];}saveState();render();return;}}}
function addBody(mid,fs){if(!FILES.body[mid])FILES.body[mid]=[];fs.forEach(function(f){FILES.body[mid].push(f);});render();}
function applyAll(mid){var src=matState(mid);shownMaterials().forEach(function(m){var s=matState(m.id);s.caption=src.caption;s.hashtag=src.hashtag;});saveState();render();toast('전체 소재에 캡션·해시태그 적용됨');}

/* 파일 선택 헬퍼 */
function pickFiles(multiple,cb){var inp=document.createElement('input');inp.type='file';inp.multiple=!!multiple;if(!multiple)inp.accept='image/*';inp.onchange=function(){cb(Array.prototype.slice.call(inp.files));};inp.click();}
/* 드래그앤드롭 */
document.addEventListener('dragover',function(e){var d=e.target.closest('.drop');if(d){e.preventDefault();d.classList.add('hot');}});
document.addEventListener('dragleave',function(e){var d=e.target.closest('.drop');if(d)d.classList.remove('hot');});
document.addEventListener('drop',function(e){var d=e.target.closest('.drop');if(!d)return;e.preventDefault();d.classList.remove('hot');
  var fs=Array.prototype.slice.call(e.dataTransfer.files);if(!fs.length)return;var act=d.getAttribute('data-act');
  if(act==='bodydrop')addBody(d.getAttribute('data-mid'),fs);
  else if(act==='coverdrop'){FILES.cover[d.getAttribute('data-cid')]=fs[0];render();}
});

/* ===== ZIP 생성 ===== */
function validate(mids){
  var errs=[];var mats=shownMaterials();
  if(mids&&mids.length)mats=mats.filter(function(m){return mids.indexOf(m.id)>=0;});
  mats.forEach(function(m){
    var L=letter(m.index)+' 소재';var s=matState(m.id);ensureAssign(m);
    if(!(FILES.body[m.id]||[]).length)errs.push(L+': 본문 파일이 없습니다');
    m.accs.forEach(function(a){
      var cid=resolveCoverId(s,a);var c=coverById(s,cid);
      if(!c){errs.push(L+' · @'+a.name+': 표지가 배정되지 않았습니다');return;}
      if(!c.copy.trim())errs.push(L+' · @'+a.name+': 표지 카피가 비어 있습니다');
      if(c.type==='image'&&!FILES.cover[c.id])errs.push(L+' · @'+a.name+': 이미지 표지인데 이미지 파일이 없습니다');
    });
  });
  return errs;
}
async function buildZip(mids){
  var errs=validate(mids);var box=$('errBox');
  if(errs.length){box.innerHTML='<b>확인 필요</b><ul>'+errs.map(function(e){return '<li>'+esc(e)+'</li>';}).join('')+'</ul>';box.classList.add('show');box.scrollIntoView({behavior:'smooth',block:'center'});return;}
  box.classList.remove('show');
  var mats=shownMaterials();
  if(mids&&mids.length)mats=mats.filter(function(m){return mids.indexOf(m.id)>=0;});
  if(!mats.length){toast('압축할 소재가 없습니다');return;}
  var zipName='['+mmdd(DATE)+'].zip';
  var tag=mmdd(DATE).replace('.','');           // "11.12" → "1112"
  var zip=new JSZip();var root=zip.folder('['+mmdd(DATE)+']');

  // 계정을 업체별로 그룹
  var byco={},order=[];
  mats.forEach(function(m){
    var s=matState(m.id),body=FILES.body[m.id]||[];
    m.accs.forEach(function(a){
      var co=companyOf(a.name);
      if(!byco[co]){byco[co]=[];order.push(co);}
      byco[co].push({s:s,body:body,a:a});
    });
  });

  var btn=$('zipBtn'),sbtn=$('zipSelBtn'),prog=$('prog'),bar=prog.firstElementChild;
  btn.disabled=true;sbtn.disabled=true;prog.classList.add('show');bar.style.width='0';
  try{
    // 업체별 폴더 + 업체별 개별 zip
    for(var i=0;i<order.length;i++){
      var co=order[i], safe=String(co).replace(/[\/\\:*?"<>|]/g,'_').trim();
      var coName='['+safe+' '+tag+']';
      var coFolder=root.folder(coName);
      var coZip=new JSZip(), coZipRoot=coZip.folder(coName);
      byco[co].forEach(function(j){
        addAcctFiles(coFolder.folder(j.a.name), j.s, j.body, j.a);
        addAcctFiles(coZipRoot.folder(j.a.name), j.s, j.body, j.a);
      });
      var coBlob=await coZip.generateAsync({type:'blob',compression:'STORE'});
      root.file(coName+'.zip', coBlob);
      bar.style.width=Math.round((i+1)/order.length*70)+'%';
    }
    // 바깥 전체 zip
    var blob=await zip.generateAsync({type:'blob',compression:'STORE'},function(md){bar.style.width=(70+(md.percent|0)*0.3)+'%';});
    var url=URL.createObjectURL(blob);var a=document.createElement('a');a.href=url;a.download=zipName;document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(url);},4000);
    toast('ZIP 생성 완료 — 다운로드를 확인하세요');
  }catch(err){toast('ZIP 생성 실패: '+err.message);}
  finally{btn.disabled=false;sbtn.disabled=false;setTimeout(function(){prog.classList.remove('show');bar.style.width='0';},800);}
}
/* 한 계정 폴더에 본문 + 표지(이미지) + caption_hashtag.txt 채우기 */
function addAcctFiles(folder, s, body, a){
  body.forEach(function(file){folder.file(file.name,file);});
  var c=coverById(s,resolveCoverId(s,a));
  if(c&&c.type==='image'){var cf=FILES.cover[c.id];if(cf)folder.file('1.cover.'+extOf(cf.name),cf);}
  folder.file('caption_hashtag.txt','표지 카피: '+(c?c.copy:'')+'\r\n캡션 : '+s.caption+'\r\n해시태그 :'+s.hashtag);
}
$('zipBtn').addEventListener('click',function(){buildZip();});
$('zipSelBtn').addEventListener('click',function(){
  var ids=Object.keys(SEL).filter(function(k){return SEL[k];});
  if(!ids.length){toast('압축할 소재를 체크해 주세요');return;}
  buildZip(ids);
});

/* ===== 초기화 ===== */
$('datePick').addEventListener('change',function(){location.href='package.html?date='+encodeURIComponent(this.value);});
async function init(){
  var q=new URLSearchParams(location.search);DATE=q.get('date')||todayKST();
  $('datePick').value=DATE;
  loadState();
  try{
    ACCOUNTS=await dbGet('accounts')||[];
    PLAN=await dbGet('plan:'+DATE)||{date:DATE,materials:[]};
    COMPANY_OVERRIDE=await dbGet('company_overrides')||{};
    $('status').textContent='['+mmdd(DATE)+'] 배정 불러옴 · 본문/표지 이미지는 새로고침하면 다시 올려야 해요(텍스트는 저장됨)';
  }catch(e){$('status').textContent='불러오기 실패 — 네트워크/권한 확인';}
  render();
}
init();
</script>
