<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>협찬 채널 소재 배정</title>
<style>
:root{
  --bg:#f6f6f4; --card:#ffffff; --head:#1f2937; --text:#1a1a1a; --muted:#6b7280;
  --border:#e5e7eb; --line:#ececeb; --accent:#4f46e5; --accent-bg:#eef2ff;
  --img:#2563eb; --img-bg:#eff6ff; --txt:#d97706; --txt-bg:#fff7ed;
  --up:#dc2626; --down:#2563eb; --danger:#dc2626; --radius:10px; --slot:#fafafa;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#161619; --card:#1f2024; --head:#0f1522; --text:#ededed; --muted:#9aa0aa;
  --border:#2e3036; --line:#26282e; --accent:#a5b4fc; --accent-bg:#232542;
  --img:#60a5fa; --img-bg:#17233b; --txt:#fbbf24; --txt-bg:#2a2112;
  --up:#f87171; --down:#60a5fa; --danger:#f87171; --slot:#191a1e;
}}
:root[data-theme="dark"]{
  --bg:#161619; --card:#1f2024; --head:#0f1522; --text:#ededed; --muted:#9aa0aa;
  --border:#2e3036; --line:#26282e; --accent:#a5b4fc; --accent-bg:#232542;
  --img:#60a5fa; --img-bg:#17233b; --txt:#fbbf24; --txt-bg:#2a2112;
  --up:#f87171; --down:#60a5fa; --danger:#f87171; --slot:#191a1e;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",Segoe UI,Roboto,sans-serif;
  padding:env(safe-area-inset-top,0) 14px env(safe-area-inset-bottom,0);font-size:14px;line-height:1.5}
.wrap{max-width:none;margin:0;padding:18px 4px 60px}
h1{font-size:18px;font-weight:600;margin:0}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:4px}
.badge{font-size:11px;font-weight:600;color:var(--accent);background:var(--accent-bg);padding:3px 9px;border-radius:999px}
.status{font-size:12px;color:var(--muted);margin:0 0 16px}
.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-left:auto}
input[type=date],input[type=text],input[type=number]{font:inherit;color:var(--text);background:var(--card);
  border:1px solid var(--border);border-radius:8px;padding:6px 9px}
button{font:inherit;cursor:pointer;border:1px solid var(--border);background:var(--card);color:var(--text);
  border-radius:8px;padding:6px 11px}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.ghost{border:none;background:transparent;color:var(--muted);padding:2px 6px}
.sec{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:16px}
.sec h2{font-size:14px;font-weight:600;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.sec h2 .n{color:var(--muted);font-weight:400;font-size:12px}
.cols{display:block}
.col{margin-bottom:16px}
.listbox{display:flex;flex-flow:column wrap;align-content:flex-start;max-height:430px;overflow-x:auto;overflow-y:hidden;padding-bottom:6px}
.panels{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.panel-acc{flex:1 1 560px;min-width:0}
.panel-mat{flex:1 1 420px;min-width:0}
.listbox .acct{flex:0 0 auto;width:272px;margin-right:8px}
.listbox .empty-note{width:220px}
.col h3{font-size:12px;font-weight:600;margin:0 0 8px;display:flex;align-items:center;gap:6px;color:var(--muted)}
.chip{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;font-weight:600}
.chip.img{color:var(--img);background:var(--img-bg)}
.chip.txt{color:var(--txt);background:var(--txt-bg)}
.chip.non{color:var(--muted);background:var(--line)}
.acct{display:flex;align-items:center;gap:7px;padding:7px 9px;border:1px solid var(--border);border-radius:8px;
  margin-bottom:7px;background:var(--card);cursor:grab}
.acct[draggable=true]:active{cursor:grabbing}
.acct.used{opacity:.45;cursor:default}
.acct.picked{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-bg)}
.acct .nm{font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acct .rate{font-weight:700;font-size:13px;white-space:nowrap}
.acct .tr{font-size:11px;font-weight:600;white-space:nowrap}
.acct .up{color:var(--up)}.acct .down{color:var(--down)}
.acct .pr{font-size:12px;color:var(--muted);white-space:nowrap}
.acct .tg{display:flex;gap:3px}
.acct .tg button{padding:1px 6px;font-size:11px;border-radius:999px;line-height:1.6}
.acct .usedtag{font-size:11px;color:var(--accent);font-weight:600;white-space:nowrap}
.totbar{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.totbar .big{font-size:16px;font-weight:600}
.mats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.mat{border:1px solid var(--border);border-radius:var(--radius);padding:10px;background:var(--card)}
.mat .mh{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.mat .mh .lbl{font-weight:600}
.mat .mh .mt{margin-left:auto;font-size:12px;color:var(--muted);font-weight:600}
.slot{border:1.5px dashed var(--border);border-radius:8px;padding:8px 9px;margin-bottom:7px;min-height:42px;
  display:flex;align-items:center;gap:8px;background:var(--slot)}
.slot.over{border-color:var(--accent);background:var(--accent-bg)}
.slot.pickable{border-style:solid;border-color:var(--accent);cursor:pointer}
.slot .empty{color:var(--muted);font-size:12px}
.slot .fn{font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot .fp{font-size:12px;color:var(--muted)}
.slot .fr{font-size:12px;font-weight:700}
.addslot{width:100%;border:1px dashed var(--border);background:transparent;color:var(--muted);border-radius:8px;padding:6px;font-size:12px;margin-top:2px}
.addslot:hover{border-color:var(--accent);color:var(--accent)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--head);color:#fff;
  padding:10px 16px;border-radius:10px;font-size:13px;opacity:0;transition:opacity .2s,transform .2s;
  pointer-events:none;z-index:50;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:60;padding:16px}
.modal.show{display:flex}
.modal .box{background:var(--card);border-radius:14px;padding:18px;width:320px;max-width:100%}
.modal h3{margin:0 0 12px;font-size:15px}
.modal label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
.modal input{width:100%}
.modal .acts{display:flex;gap:8px;margin-top:16px}
.modal .acts .primary{flex:1}
.seg{display:flex;gap:6px}
.seg button{flex:1}
.seg button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.empty-note{color:var(--muted);font-size:13px;padding:6px 0}
.charttip{position:fixed;z-index:70;background:var(--head);color:#fff;font-size:12px;font-weight:600;padding:5px 9px;border-radius:8px;pointer-events:none;opacity:0;transition:opacity .08s;white-space:nowrap;transform:translate(-50%,-135%)}
.charttip.show{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>협찬 채널 소재 배정</h1>
    <span class="badge" id="freshness">참여율 매일 07:00 갱신</span>
    <div class="bar">
      <button class="ghost" id="themeBtn" title="테마">◐</button>
      <button id="backupBtn" title="백업/복원">백업</button>
      <label style="font-size:12px;color:var(--muted)">날짜</label>
      <input type="date" id="date">
      <button id="todayBtn">오늘</button>
    </div>
  </div>
  <p class="status" id="status">불러오는 중…</p>

  <div class="panels">
  <div class="sec panel-acc">
    <h2>계정 목록 <span class="n">평균 좋아요 많은 순 · 드래그로 배정 · 계정명 클릭 시 상세</span>
      <button class="primary" id="addAcct" style="margin-left:auto">+ 계정 추가</button>
    </h2>
    <div class="cols">
      <div class="col"><h3><span class="chip img">이미지 썸네일</span></h3><div class="listbox" id="colImg"></div></div>
      <div class="col"><h3><span class="chip txt">텍스트 썸네일</span></h3><div class="listbox" id="colTxt"></div></div>
      <div class="col"><h3><span class="chip non">미설정</span></h3><div class="listbox" id="colNon"></div></div>
    </div>
  </div>

  <div class="sec panel-mat">
    <div class="totbar">
      <h2 style="margin:0">소재 배정</h2>
      <div style="margin-left:auto" class="big" id="grand">총 0만원</div>
      <button id="textBtn" class="primary">텍스트화</button>
      <button id="pkgBtn" onclick="location.href='package.html?date='+encodeURIComponent(DATE)">📦 패키징</button>
      <button id="addMat">+ 소재 추가</button>
    </div>
    <div class="mats" id="mats"></div>
  </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="charttip" id="dTip"></div>
<input type="file" id="restoreFile" accept="application/json" style="display:none">

<div class="modal" id="detailModal">
  <div class="box" style="width:460px">
    <h3 id="dTitle"></h3>
    <div id="dBody"></div>
    <div class="acts"><button class="primary" id="dClose" style="flex:1">닫기</button></div>
  </div>
</div>

<div class="modal" id="textModal">
  <div class="box" style="width:760px;max-width:100%">
    <h3>소재 배정 텍스트</h3>
    <div style="display:flex;gap:12px;flex-wrap:wrap">
      <div style="flex:1 1 300px;min-width:0">
        <div style="font-size:12px;font-weight:700;margin-bottom:4px;color:var(--muted)">소재별</div>
        <textarea id="tTextL" readonly style="width:100%;height:300px;font:13px/1.6 ui-monospace,monospace;color:var(--text);background:var(--slot);border:1px solid var(--border);border-radius:8px;padding:10px;resize:vertical"></textarea>
        <button class="primary" id="tCopyL" style="width:100%;margin-top:6px">소재별 복사</button>
      </div>
      <div style="flex:1 1 300px;min-width:0">
        <div style="font-size:12px;font-weight:700;margin-bottom:4px;color:var(--muted)">업체별</div>
        <textarea id="tTextR" readonly style="width:100%;height:300px;font:13px/1.6 ui-monospace,monospace;color:var(--text);background:var(--slot);border:1px solid var(--border);border-radius:8px;padding:10px;resize:vertical"></textarea>
        <button class="primary" id="tCopyR" style="width:100%;margin-top:6px">업체별 복사</button>
      </div>
    </div>
    <div class="acts"><button id="tClose" style="flex:1">닫기</button></div>
  </div>
</div>

<div class="modal" id="modal">
  <div class="box">
    <h3 id="mTitle">계정 추가</h3>
    <label>계정명</label>
    <input type="text" id="mName" placeholder="예: luna.humor" autocomplete="off">
    <label>썸네일 유형</label>
    <div class="seg" id="mType">
      <button data-t="image">이미지</button>
      <button data-t="text">텍스트</button>
      <button data-t="none">미설정</button>
    </div>
    <label>단가 (만원)</label>
    <input type="number" id="mPrice" min="0" step="1" placeholder="예: 10">
    <div class="acts">
      <button id="mDelete" class="ghost" style="color:var(--danger)">삭제</button>
      <button class="primary" id="mSave">저장</button>
      <button id="mCancel">취소</button>
    </div>
  </div>
</div>

async function dbGet(k){var r=await SB.from('store').select('v').eq('k',k).maybeSingle();if(r.error)throw r.error;return r.data?r.data.v:null;}

async function migrateLocalIfAny(){
  var local=lsGet('cm_accounts',null);
  if(local&&local.length){
    await dbSet('accounts',local);
    for(var i=0;i<localStorage.length;i++){var lk=localStorage.key(i);if(lk&&lk.indexOf('cm_plan_')===0){var p=lsGet(lk,null);if(p)await dbSet('plan:'+lk.slice(8),p);}}
    return local;
  }
  return null;
}
async function loadAccounts(){
  var a=await dbGet('accounts');
  if(!a||!a.length){ a=await migrateLocalIfAny()||[]; }
  ACCOUNTS=a;
}
function saveAccounts(){ lastAccJson=JSON.stringify(ACCOUNTS); dbSet('accounts',ACCOUNTS); }
async function loadPlan(){ PLAN=await dbGet('plan:'+DATE)||emptyPlan(DATE); }
function savePlan(){ lastPlanJson=JSON.stringify(PLAN); dbSet('plan:'+DATE,PLAN); }
async function refreshFromDb(){
  try{
    var a=await dbGet('accounts');var aj=JSON.stringify(a||[]);
    if(aj!==lastAccJson){lastAccJson=aj;ACCOUNTS=a||[];renderAccounts();}
    var p=await dbGet('plan:'+DATE);var pj=JSON.stringify(p||emptyPlan(DATE));
    if(pj!==lastPlanJson){lastPlanJson=pj;PLAN=p||emptyPlan(DATE);renderPlan();}
    var co=await dbGet('company_overrides');var cj=JSON.stringify(co||{});
    if(cj!==lastCoJson){lastCoJson=cj;COMPANY_OVERRIDE=co||{};}
  }catch(e){}
}
function startSync(){
  try{SB.channel('store-sync').on('postgres_changes',{event:'*',schema:'public',table:'store'},function(){refreshFromDb();}).subscribe();}catch(e){}
  setInterval(refreshFromDb,7000);
}

function usedMap(){var map={};if(!PLAN)return map;PLAN.materials.forEach(function(m,mi){m.slots.forEach(function(aid){if(aid)map[aid]=mi;});});return map;}

  if(used[aid]===mi){toast('이미 이 소재에 있어요');return;}

}

function sortByEff(a,b){

  var rb=(EFF[b.name]&&EFF[b.name].likes!=null)?EFF[b.name].likes:-1;
  if(rb!==ra)return rb-ra; return a.name.localeCompare(b.name);
}

function renderAccounts(){
  var used=usedMap(), b={image:[],text:[],none:[]};

  function card(a){

    var right=u?'<span class="usedtag">'+letter(used[a.id])+' 사용중</span>':'';
    return '<div class="acct'+(u?' used':'')+(picked===a.id?' picked':'')+'" data-aid="'+a.id+'" draggable="'+(!u)+'">'
      +'<span class="nm" data-act="detail" data-id="'+a.id+'">@'+esc(a.name)+'</span>'
      +rateHTML(a.name)
      +'<span class="pr">'+won(a.price)+'</span>'+tg+right
      +'<button class="ghost" data-act="edit" data-id="'+a.id+'" title="수정">⋯</button></div>';
  }
  function fill(el,arr,msg){el.innerHTML=arr.length?arr.map(card).join(''):'<div class="empty-note">'+msg+'</div>';}
  fill($('colImg'),b.image,'아직 없어요');
  fill($('colTxt'),b.text,'아직 없어요');
  fill($('colNon'),b.none,'전부 유형이 지정됐어요 👍');
}
function renderPlan(){
  if(!PLAN)PLAN=emptyPlan(DATE);
  var grand=0;
  var html=PLAN.materials.map(function(m,mi){
    var mt=0;
    var slots=m.slots.map(function(aid,si){
      if(aid){var a=acctById(aid);
        if(a){mt+=(a.price||0);
          var chip=a.type==='image'?'<span class="chip img">이미지</span>':a.type==='text'?'<span class="chip txt">텍스트</span>':'<span class="chip non">미설정</span>';
          var e=EFF[a.name]; var fr=(e&&e.likes!=null)?'<span class="fr">❤ '+Number(e.likes).toLocaleString()+'</span>':'';
          return '<div class="slot" data-mi="'+mi+'" data-si="'+si+'"><span class="fn">@'+esc(a.name)+'</span>'+chip+fr+'<span class="fp">'+won(a.price)+'</span><button class="ghost" data-act="clear" data-mi="'+mi+'" data-si="'+si+'">✕</button></div>';
        }
        return '<div class="slot" data-mi="'+mi+'" data-si="'+si+'"><span class="empty">삭제된 계정</span><button class="ghost" data-act="clear" data-mi="'+mi+'" data-si="'+si+'">✕</button></div>';
      }
      return '<div class="slot'+(picked?' pickable':'')+'" data-mi="'+mi+'" data-si="'+si+'"><span class="empty">'+(picked?'여기 클릭':'끌어다 놓기')+'</span></div>';
    }).join('');
    grand+=mt;
    return '<div class="mat"><div class="mh"><span class="lbl">'+letter(mi)+' 소재</span><span class="mt">'+won(mt)+'</span><button class="ghost" data-act="delmat" data-mi="'+mi+'" title="소재 삭제">✕</button></div>'+slots+'<button class="addslot" data-act="addslot" data-mi="'+mi+'">+ 채널 추가</button></div>';
  }).join('');
  $('mats').innerHTML=html;
  $('grand').textContent='총 '+won(grand);
}

function fmt(n){return Number(n).toLocaleString();}
function weekdayKr(dstr){var d=new Date(dstr+'T00:00:00');return ['일','월','화','수','목','금','토'][d.getDay()];}
function genTextBySojae(){
  if(!PLAN) return '';
  var m=/\d{4}-(\d{2})-(\d{2})/.exec(DATE);
  var groups=[], grand=0;
  PLAN.materials.forEach(function(mat){
    var lines=mat.slots.map(function(aid){var a=aid&&acctById(aid);if(!a)return null;grand+=(a.price||0);return '- '+a.name+' '+won(a.price);}).filter(Boolean);
    if(lines.length) groups.push(lines.join('\n'));
  });
  var head=(m?('['+m[1]+m[2]+'('+weekdayKr(DATE)+')]'):DATE)+' '+won(grand);
  return head+'\n'+groups.join('\n\n');
}
function companyOf(name){return COMPANY_OVERRIDE[name]||COMPANY_BY_ACCOUNT[name]||'(업체 미지정)';}
function genTextByCompany(){
  if(!PLAN) return '';
  var order=[],byco={};
  PLAN.materials.forEach(function(mat){
    mat.slots.forEach(function(aid){
      var a=aid&&acctById(aid); if(!a) return;
      var co=companyOf(a.name);
      if(!byco[co]){byco[co]=[];order.push(co);}
      byco[co].push('- '+a.name+' '+won(a.price));
    });
  });
  return order.map(function(co){return '['+co+']\n'+byco[co].join('\n');}).join('\n\n');
}

function sparkLikes(posts){
  var p=(posts||[]).filter(function(x){return x.likes!=null;});
  if(p.length<2) return '<div style="color:var(--muted);font-size:12px">추이를 그릴 게시물이 부족해요</div>';
  var ys=p.map(function(x){return x.likes;});
  var mn=Math.min.apply(null,ys),mx=Math.max.apply(null,ys),sp=(mx-mn)||1;
  var w=440,h=120,padX=16,padT=12,padB=24;
  var step=(w-padX*2)/(p.length-1);
  function X(i){return padX+i*step;}
  function Y(v){return (h-padB)-((v-mn)/sp)*(h-padB-padT);}
  function md(d){var m=/\d{4}-(\d{2})-(\d{2})/.exec(d||'');return m?m[1]+'.'+m[2]:'';}
  var line=p.map(function(x,i){return X(i).toFixed(1)+','+Y(x.likes).toFixed(1);}).join(' ');
  var dots=p.map(function(x,i){var cx=X(i).toFixed(1),cy=Y(x.likes).toFixed(1);
    return '<circle cx="'+cx+'" cy="'+cy+'" r="4" fill="var(--accent)" stroke="var(--card)" stroke-width="1.5" style="pointer-events:none"/>'
      +'<circle cx="'+cx+'" cy="'+cy+'" r="11" fill="transparent" data-likes="'+fmt(x.likes)+'" data-date="'+md(x.date)+'" style="cursor:pointer"/>';}).join('');
  var seen={},labels='';
  p.forEach(function(x,i){var k=md(x.date);if(k&&!seen[k]){seen[k]=1;labels+='<text x="'+X(i).toFixed(1)+'" y="'+(h-7)+'" font-size="9" fill="var(--muted)" text-anchor="middle">'+k+'</text>';}});
  return '<svg viewBox="0 0 '+w+' '+h+'" style="width:100%;height:auto;overflow:visible">'
    +'<polyline points="'+line+'" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>'
    +dots+labels+'</svg>'
    +'<div style="font-size:11px;color:var(--muted);margin-top:2px">꼭짓점에 마우스를 올리면 날짜·좋아요 수가 떠요</div>';
}
function openDetail(id){
  var a=acctById(id); if(!a) return;
  var e=EFF[a.name]||{};
  var posts=(e.posts||[]);
  var top=posts.slice().sort(function(x,y){return (y.likes||0)-(x.likes||0);}).slice(0,5);
  var co=companyOf(a.name);
  var h='';
  h+='<div style="display:flex;align-items:center;gap:6px;margin-bottom:12px">'
    +'<span style="font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap">업체명</span>'
    +'<input id="dCompanyInput" type="text" value="'+esc(co==='(업체 미지정)'?'':co)+'" placeholder="업체명 입력 후 저장" '
    +'style="flex:1;min-width:0;font:inherit;padding:6px 9px;border:1px solid var(--border);border-radius:7px;background:var(--card);color:var(--text)">'
    +'<button data-act="savecompany" data-name="'+esc(a.name)+'" class="primary" style="padding:6px 14px;white-space:nowrap">저장</button></div>';
  h+='<div style="font-size:13px;color:var(--muted);margin-bottom:6px">'
    +(e.followers!=null?'팔로워 <b style="color:var(--text)">'+fmt(e.followers)+'</b> · ':'')
    +'참여율 <b style="color:var(--text)">'+(e.rate!=null?e.rate.toFixed(2)+'%':'—')+'</b>'
    +' · 평균 좋아요(7일) <b style="color:var(--text)">'+(e.likes!=null?fmt(e.likes):'—')+'</b></div>';
  h+='<div style="font-size:12px;font-weight:700;margin:14px 0 4px">최근 7일 좋아요 추이</div>'+sparkLikes(posts);
  h+='<div style="font-size:12px;font-weight:700;margin:16px 0 6px">좋아요 TOP 5 (최근 7일)</div>';
  if(top.length){
    h+='<ol style="margin:0;padding-left:20px">'+top.map(function(p){
      var lnk=p.permalink?' <a href="'+p.permalink+'" target="_blank" rel="noopener" style="color:var(--accent);text-decoration:none">열기↗</a>':'';
      return '<li style="margin-bottom:5px">❤ <b>'+fmt(p.likes)+'</b> <span style="color:var(--muted)">· '+(p.date||'')+'</span>'+lnk+'</li>';
    }).join('')+'</ol>';
  } else {
    h+='<div style="color:var(--muted);font-size:13px">수집된 게시물이 없어요. (Actions 수집을 한 번 돌리면 표시됩니다)</div>';
  }
  $('dTitle').innerHTML='@'+esc(a.name)+' <span style="font-size:12px;font-weight:600;color:var(--text-accent,var(--accent));background:var(--accent-bg);padding:2px 9px;border-radius:999px;vertical-align:middle;margin-left:6px">'+esc(co)+'</span>';
  $('dBody').innerHTML=h;
  $('detailModal').classList.add('show');
}
function openModal(a){
  var m=$('modal');m.classList.add('show');
  $('mTitle').textContent=a?'계정 수정':'계정 추가';
  $('mName').value=a?a.name:'';$('mPrice').value=a?(a.price!=null?a.price:''):'';
  var t=a?a.type:'none';
  Array.prototype.forEach.call($('mType').children,function(bt){bt.classList.toggle('on',bt.dataset.t===t);});
  $('mDelete').style.display=a?'block':'none';m._editId=a?a.id:null;
  setTimeout(function(){$('mName').focus();},50);
}
function closeModal(){$('modal').classList.remove('show');}

document.addEventListener('click',function(e){
  var t=e.target,act=t.getAttribute('data-act');
  if(t.id==='addAcct'){openModal(null);return;}
  if(t.id==='addMat'){addMaterial();return;}
  if(t.id==='textBtn'){openTextModal();return;}
  if(act==='addslot'){addSlot(+t.getAttribute('data-mi'));return;}
  if(t.id==='todayBtn'){$('date').value=todayKST();changeDate(todayKST());return;}
  if(t.id==='themeBtn'){toggleTheme();return;}
  if(t.id==='backupBtn'){backupMenu();return;}
  if(act==='detail'){openDetail(t.getAttribute('data-id'));return;}
  if(act==='savecompany'){
    var nm=t.getAttribute('data-name');var inp=$('dCompanyInput');var val=(inp?inp.value:'').trim();
    if(val)COMPANY_OVERRIDE[nm]=val; else delete COMPANY_OVERRIDE[nm];
    lastCoJson=JSON.stringify(COMPANY_OVERRIDE); dbSet('company_overrides',COMPANY_OVERRIDE);
    toast('업체명 저장됨'); var acc=ACCOUNTS.filter(function(x){return x.name===nm;})[0]; if(acc)openDetail(acc.id);
    return;
  }
  if(act==='type'){setType(t.getAttribute('data-id'),t.getAttribute('data-t'));return;}
  if(act==='edit'){openModal(acctById(t.getAttribute('data-id')));return;}
  if(act==='clear'){clearSlot(+t.getAttribute('data-mi'),+t.getAttribute('data-si'));return;}
  if(act==='delmat'){removeMaterial(+t.getAttribute('data-mi'));return;}
  var slot=t.closest('.slot');
  if(slot&&picked){place(picked,+slot.getAttribute('data-mi'),+slot.getAttribute('data-si'));return;}
  var acctEl=t.closest('.acct');
  if(acctEl&&!t.closest('button')){var aid=acctEl.getAttribute('data-aid');if(usedMap()[aid]===undefined){picked=(picked===aid)?null:aid;render();}return;}
});
document.addEventListener('dragstart',function(e){var c=e.target.closest?e.target.closest('.acct'):null;if(c&&c.getAttribute('draggable')==='true'){e.dataTransfer.setData('text/plain',c.dataset.aid);e.dataTransfer.effectAllowed='move';}});
document.addEventListener('dragover',function(e){var s=e.target.closest?e.target.closest('.slot'):null;if(s){e.preventDefault();s.classList.add('over');}});
document.addEventListener('dragleave',function(e){var s=e.target.closest?e.target.closest('.slot'):null;if(s)s.classList.remove('over');});
document.addEventListener('drop',function(e){var s=e.target.closest?e.target.closest('.slot'):null;if(!s)return;e.preventDefault();s.classList.remove('over');var aid=e.dataTransfer.getData('text/plain');if(aid)place(aid,+s.getAttribute('data-mi'),+s.getAttribute('data-si'));});

$('mType').addEventListener('click',function(e){if(e.target.dataset.t){Array.prototype.forEach.call(this.children,function(b){b.classList.remove('on');});e.target.classList.add('on');}});
$('mCancel').addEventListener('click',closeModal);
$('modal').addEventListener('click',function(e){if(e.target===this)closeModal();});
$('dClose').addEventListener('click',function(){$('detailModal').classList.remove('show');});
$('detailModal').addEventListener('click',function(e){if(e.target===this)this.classList.remove('show');});
function tipAt(e,c){var tip=$('dTip');tip.textContent=c.getAttribute('data-date')+' · ❤ '+c.getAttribute('data-likes');tip.style.left=e.clientX+'px';tip.style.top=e.clientY+'px';tip.classList.add('show');}
document.addEventListener('mouseover',function(e){var c=e.target.closest?e.target.closest('circle[data-likes]'):null;if(c)tipAt(e,c);});
document.addEventListener('mousemove',function(e){if(!$('dTip').classList.contains('show'))return;var c=e.target.closest?e.target.closest('circle[data-likes]'):null;if(c){tipAt(e,c);}else{$('dTip').classList.remove('show');}});
document.addEventListener('mouseout',function(e){var c=e.target.closest?e.target.closest('circle[data-likes]'):null;if(c)$('dTip').classList.remove('show');});
$('tClose').addEventListener('click',function(){$('textModal').classList.remove('show');});
$('textModal').addEventListener('click',function(e){if(e.target===this)this.classList.remove('show');});
function copyTa(id){var ta=$(id);ta.focus();ta.select();ta.setSelectionRange(0,999999);
  var ok=function(){toast('복사됐어요');};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(ta.value).then(ok,function(){try{document.execCommand('copy');ok();}catch(e){toast('복사 실패 — 직접 선택해 복사하세요');}});}
  else{try{document.execCommand('copy');ok();}catch(e){toast('복사 실패 — 직접 선택해 복사하세요');}}}
$('tCopyL').addEventListener('click',function(){copyTa('tTextL');});
$('tCopyR').addEventListener('click',function(){copyTa('tTextR');});
$('mSave').addEventListener('click',function(){
  var name=$('mName').value.trim().replace(/^@/,'');if(!name){toast('계정명을 입력하세요');return;}
  var price=parseInt($('mPrice').value,10);if(isNaN(price))price=0;
  var on=$('mType').querySelector('.on');var type=on?on.dataset.t:'none';var id=$('modal')._editId;
  if(id){var a=acctById(id);if(a){a.name=name;a.price=price;a.type=type;}}
  else{ACCOUNTS.push({id:uid(),name:name,type:type,price:price});}
  saveAccounts();render();closeModal();
});
$('mDelete').addEventListener('click',function(){
  var id=$('modal')._editId;if(!id)return;
  ACCOUNTS=ACCOUNTS.filter(function(a){return a.id!==id;});
  if(PLAN){PLAN.materials.forEach(function(m){m.slots=m.slots.map(function(x){return x===id?null:x;});});savePlan();}
  saveAccounts();render();closeModal();
});

async function changeDate(d){DATE=d;picked=null;PLAN=await dbGet('plan:'+DATE)||emptyPlan(DATE);lastPlanJson=JSON.stringify(PLAN);render();}
$('date').addEventListener('change',function(){changeDate(this.value||todayKST());});

function toggleTheme(){var r=document.documentElement;var cur=r.getAttribute('data-theme');var next=cur==='dark'?'light':(cur==='light'?'':'dark');if(next)r.setAttribute('data-theme',next);else r.removeAttribute('data-theme');try{localStorage.setItem('cm_theme',next);}catch(e){}}
try{var th=localStorage.getItem('cm_theme');if(th)document.documentElement.setAttribute('data-theme',th);}catch(e){}

async function backupMenu(){
  if(confirm('확인 = 백업 파일 내려받기\n취소 = 백업 파일 불러오기(복원)')){
    var data={accounts:ACCOUNTS,plans:{}};
    try{var rr=await SB.from('store').select('k,v').like('k','plan:%');(rr.data||[]).forEach(function(row){data.plans[row.k]=row.v;});}catch(e){}
    var blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
    var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='channel-planner-backup-'+todayKST()+'.json';a.click();
    toast('백업 파일을 내려받았어요');
  } else { $('restoreFile').click(); }
}
$('restoreFile').addEventListener('change',function(){
  var f=this.files[0];if(!f)return;var rd=new FileReader();
  rd.onload=async function(){try{var d=JSON.parse(rd.result);
    if(d.accounts){await dbSet('accounts',d.accounts);}
    if(d.plans){var ks=Object.keys(d.plans);for(var i=0;i<ks.length;i++){var k=ks[i];var nk=k.indexOf('cm_plan_')===0?('plan:'+k.slice(8)):k;await dbSet(nk,d.plans[k]);}}
    toast('복원 완료 — 모두에게 공유됩니다. 새로고침할게요');setTimeout(function(){location.reload();},1000);
  }catch(e){toast('파일을 읽을 수 없어요');}};
  rd.readAsText(f);this.value='';
});

var _qd=new URLSearchParams(location.search).get('date');
if(_qd&&/^\d{4}-\d{2}-\d{2}$/.test(_qd))DATE=_qd;
$('date').value=DATE;
$('status').textContent='공유 저장 연결 중…';
(async function(){
  try{
    await loadAccounts(); await loadPlan();
    COMPANY_OVERRIDE=await dbGet('company_overrides')||{}; lastCoJson=JSON.stringify(COMPANY_OVERRIDE);
    lastAccJson=JSON.stringify(ACCOUNTS); lastPlanJson=JSON.stringify(PLAN);
    render();
    $('status').textContent='✅ 팀 공유 저장 · 모두 같은 데이터를 봅니다 · 효율은 매일 07시 자동 갱신';
    startSync();
  }catch(e){
    $('status').textContent='⚠️ 공유 저장 연결 실패 — 상단 URL/키 또는 Supabase 정책을 확인하세요';
  }
  loadEfficiency();
})();
</script>
